name: sync to hugging face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.30"
      - name: upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import upload_folder
          upload_folder(
              repo_id="cukrus/FLUX.2-klein-4B-bnb-nf4",
              folder_path=".",
              ignore_patterns=[".git/*", ".github/*", ".gitignore", "*.safetensors"],
              commit_message="sync from github " + os.environ["GITHUB_SHA"][:7],
          )
          PY
